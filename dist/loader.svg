<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title"><title id="title">Na Lista: carregando</title><style>.tile{animation:breathe 1.8s ease-in-out infinite}.tick{stroke-dasharray:52;stroke-dashoffset:52;animation:check 1.8s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}@keyframes check{0%,15%{stroke-dashoffset:52;opacity:0}35%{opacity:1}65%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@media(prefers-reduced-motion:reduce){.tile,.tick{animation:none}.tick{stroke-dashoffset:0}}</style><rect class="tile" width="128" height="128" rx="30" fill="#294c39"/><path d="M39 47h50l6 47a7 7 0 0 1-7 8H40a7 7 0 0 1-7-8l6-47ZM51 48V38a13 13 0 0 1 26 0v10" fill="none" stroke="#d0ef9a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path class="tick" d="m49 73 11 11 22-23" fill="none" stroke="#d0ef9a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
